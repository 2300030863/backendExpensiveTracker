services:
  # Web Service
  - type: web
    name: expense-tracker-backend
    env: java
    region: oregon
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: java -jar target/ExpenseTrackerApplication.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: expense-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: expense-tracker-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false  # Set this manually in Render dashboard
      - key: MAIL_PASSWORD
        sync: false  # Set this manually in Render dashboard
      - key: MAIL_FROM
        sync: false  # Set this manually in Render dashboard
      - key: DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: false
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /expense-tracker-api/actuator/health

databases:
  # MySQL Database
  - name: expense-tracker-db
    databaseName: expense_tracker
    user: expense_tracker_user
    plan: free
    region: oregon
